<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#0b4a3f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Thailand">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<title>Thailand Family Travel Guide</title>
<style>:root{--bg:#f6f1e6;--bg2:#efe8d8;--fg:#1f1b15;--mut:#5c5547;--card:#fffdf8;--line:#ddd2ba;--acc:#0b4a3f;--accfg:#fff;--gold:#7a5c10;--goldl:#b8923a;
--tip:#e6f1ea;--tipb:#2d7a57;--tipt:#1d5a3d;--heads:#fbf0d6;--headsb:#b8923a;--headst:#6e520b;--must:#f9e4e0;--mustb:#b3322a;--mustt:#8f241d;
--info:#e5eef7;--infob:#3a6fa8;--infot:#245080;--teen:#eee7f7;--teenb:#7249b0;--teent:#573590;--sos:#a82a22;
--shadow:0 1px 2px rgba(60,45,10,.06),0 6px 18px rgba(60,45,10,.07);--serif:Georgia,"Iowan Old Style","Palatino Linotype",Palatino,"Times New Roman",serif}
@media (prefers-color-scheme:dark){:root{--bg:#0e1513;--bg2:#131d1a;--fg:#efe9da;--mut:#b4ad9b;--card:#16211e;--line:#2d3a35;--acc:#8fd9c0;--accfg:#06241d;--gold:#dcb865;--goldl:#b8923a;
--tip:#163025;--tipt:#8fd9b0;--heads:#322a10;--headst:#e6c56e;--must:#3a1a17;--mustt:#ffab9f;--info:#142538;--infot:#9cc5f0;--teen:#251a38;--teent:#c9acf2;--sos:#c8453b;--shadow:none}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans Thai","Thonburi",sans-serif;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
a{color:var(--acc)}
h1,h2,h3,.serif{font-family:var(--serif);font-weight:600;letter-spacing:.01em}
button{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--goldl);outline-offset:2px}
.appbar{position:sticky;top:0;z-index:15;display:flex;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;background:var(--acc);color:var(--accfg);border-bottom:2px solid var(--goldl)}
.appbar .brand{flex:1;font-family:var(--serif);font-size:1.12rem;letter-spacing:.04em}
.appbar .brand small{display:block;font-family:-apple-system,sans-serif;font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;opacity:.85}
.appbar button{border:1px solid rgba(255,255,255,.45);background:rgba(255,255,255,.08);color:var(--accfg);border-radius:999px;padding:8px 13px;font-size:.85rem;font-weight:600}
@media (prefers-color-scheme:dark){.appbar button{border-color:rgba(6,36,29,.5);background:rgba(6,36,29,.1)}}
main{max-width:760px;margin:0 auto;padding:16px 14px 0}
.view{display:none}.view.on{display:block}
h2.vt{font-size:1.6rem;margin:6px 0 4px;color:var(--acc)}
.rule{height:1px;background:linear-gradient(90deg,var(--goldl),transparent);margin:6px 0 14px;border:0}
.eyebrow{font-size:.72rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:0 0 14px;box-shadow:var(--shadow)}
.hero{background:linear-gradient(160deg,var(--acc),#0f6a59);color:#fff;border-radius:18px;padding:20px 18px;margin:0 0 14px;border:1px solid var(--goldl);box-shadow:var(--shadow)}
@media (prefers-color-scheme:dark){.hero{background:linear-gradient(160deg,#173a31,#0f2a24);color:#efe9da}}
.hero .eyebrow{color:#e9cf8e}
.hero h2{margin:4px 0 2px;font-size:1.65rem;line-height:1.2;color:inherit}
.hero .sub{opacity:.92;font-size:.95rem}
.bigtime{font-family:var(--serif);font-size:2.6rem;line-height:1;margin:12px 0 2px;color:#f3dfa6}
.bigtime small{font-size:1rem;font-family:-apple-system,sans-serif;color:inherit;opacity:.95;margin-left:8px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;margin:0 -14px;padding-left:14px;padding-right:14px;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch}
.chip{flex:none;scroll-snap-align:center;min-width:56px;text-align:center;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:7px 8px;line-height:1.15}
.chip b{display:block;font-family:var(--serif);font-size:1.15rem}
.chip span{font-size:.7rem;color:var(--mut);letter-spacing:.06em;text-transform:uppercase}
.chip.sel{background:var(--acc);color:var(--accfg);border-color:var(--goldl)}.chip.sel span{color:inherit;opacity:.9}
.chip.today{box-shadow:0 0 0 2px var(--goldl)}
.kv{display:grid;grid-template-columns:7.2rem 1fr;gap:2px 12px;margin:0}
.kv dt{font-size:.74rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);padding-top:3px}
.kv dd{margin:0 0 10px;min-width:0;overflow-wrap:anywhere}
.btnrow{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--acc);background:var(--acc);color:var(--accfg);text-decoration:none;border-radius:12px;padding:12px 14px;font-weight:700;font-size:.92rem;min-height:44px}
.btn.alt{background:transparent;color:var(--acc)}
.btn.sos{background:var(--sos);border-color:var(--sos);color:#fff}
.pill{display:inline-block;border-radius:999px;padding:3px 10px;font-size:.74rem;font-weight:700;border:1px solid;letter-spacing:.03em;background:transparent;white-space:nowrap}
.pill.booked{color:var(--tipt);border-color:var(--tipb)}.pill.tobook{color:var(--mustt);border-color:var(--mustb)}.pill.idea{color:var(--infot);border-color:var(--infob)}.pill.decide{color:var(--headst);border-color:var(--headsb)}
.planb{background:var(--heads);border-left:4px solid var(--headsb);border-radius:10px;padding:10px 12px;margin:12px 0 0;color:var(--fg)}
.planb b{color:var(--headst)}
.bring{margin:6px 0 0;padding:0;list-style:none}
.bring li{padding:5px 0 5px 26px;position:relative;border-bottom:1px dotted var(--line)}
.bring li::before{content:"✦";position:absolute;left:2px;color:var(--gold)}
.pcity{margin:20px 0 8px;font-size:1.2rem;color:var(--acc)}
.prow{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 12px;margin:0 0 8px;min-height:60px}
.prow .d{flex:none;width:52px;text-align:center;font-family:var(--serif);line-height:1.1}
.prow .d b{display:block;font-size:1.2rem;color:var(--acc)}.prow .d span{font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);font-family:-apple-system,sans-serif}
.prow .t{flex:1;min-width:0}.prow .t b{display:block;font-size:.98rem}.prow .t span{font-size:.84rem;color:var(--mut)}
.prow.now{border-color:var(--goldl);box-shadow:0 0 0 2px var(--goldl)}
.seg{display:flex;gap:6px;margin:0 0 12px}
.seg button{flex:1;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:9px;font-weight:600;font-size:.88rem}
.seg button.on{background:var(--acc);color:var(--accfg);border-color:var(--acc)}
.todo{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin:0 0 8px}
.todo input[type=checkbox]{width:26px;height:26px;flex:none;accent-color:var(--acc);margin-top:2px}
.todo .tb{flex:1;min-width:0}.todo .tx{overflow-wrap:anywhere}
.todo.done .tx{text-decoration:line-through;opacity:.6}
.todo .meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
.todo .own{flex:1;min-width:7rem;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:10px;padding:8px 10px;font-size:16px}
.due{font-size:.78rem;font-weight:700}.due.over{color:var(--mustt)}.due.soon{color:var(--headst)}.due.ok{color:var(--mut)}
.search{width:100%;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:14px;padding:13px 14px;font-size:16px;margin:0 0 12px}
.grp{font-size:1.15rem;color:var(--acc);margin:22px 0 8px;display:flex;align-items:center;gap:10px}
.grp::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--goldl),transparent)}
details.sec{background:var(--card);border:1px solid var(--line);border-radius:14px;margin:0 0 10px;box-shadow:var(--shadow);scroll-margin-top:70px}
details.sec>summary{list-style:none;cursor:pointer;padding:15px 16px;font-family:var(--serif);font-weight:600;font-size:1.1rem;display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:52px}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary::after{content:"";width:9px;height:9px;border-right:2.5px solid var(--gold);border-bottom:2.5px solid var(--gold);transform:rotate(45deg);transition:transform .15s;flex:none;margin-right:4px}
details.sec[open]>summary::after{transform:rotate(-135deg)}
details.sec[open]>summary{border-bottom:1px solid var(--line);color:var(--acc)}
.secbody{padding:6px 16px 16px}
.secbody h3{margin:22px 0 6px;font-size:1.15rem;color:var(--acc)}
.secbody h4{margin:20px 0 8px;font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);border-bottom:1px solid var(--line);padding-bottom:4px}
.secbody p{margin:.55em 0}.secbody ul,.secbody ol{padding-left:1.25em;margin:.5em 0}.secbody li{margin:.35em 0}
.secbody li:has(>label.ck){list-style:none;margin-left:-1.1em}
label.ck{display:flex;gap:10px;align-items:flex-start;padding:4px 0}
label.ck input{width:22px;height:22px;flex:none;margin-top:2px;accent-color:var(--acc)}
label.ck input:checked+span{text-decoration:line-through;opacity:.6}
.tw{overflow-x:auto;margin:10px -4px;-webkit-overflow-scrolling:touch}
.tw.wide table{min-width:34rem}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{text-align:left;vertical-align:top;padding:8px 9px;border-bottom:1px solid var(--line)}
th{background:var(--bg2);font-weight:700;white-space:nowrap;color:var(--acc)}
td:first-child{min-width:5.5rem}
.tw:not(.wide) table{table-layout:fixed}
.tw:not(.wide) td,.tw:not(.wide) th{overflow-wrap:anywhere}
.tw:not(.wide) td:first-child{width:30%}
tbody tr:nth-child(even){background:rgba(127,127,127,.06)}
.callout{border-left:5px solid;border-radius:10px;padding:10px 12px;margin:12px 0;font-size:.95rem}
.callout>div p{margin:.3em 0}
.ctag{display:flex;align-items:center;gap:7px;font-size:.74rem;font-weight:800;text-transform:uppercase;letter-spacing:.09em;margin-bottom:3px}
.ctag i{font-style:normal;display:inline-flex;width:20px;height:20px;border-radius:50%;border:1.5px solid currentColor;align-items:center;justify-content:center;font-size:.72rem;letter-spacing:0}
.callout.tip{background:var(--tip);border-color:var(--tipb)}.tip .ctag{color:var(--tipt)}
.callout.heads{background:var(--heads);border-color:var(--headsb)}.heads .ctag{color:var(--headst)}
.callout.must{background:var(--must);border-color:var(--mustb)}.must .ctag{color:var(--mustt)}
.callout.info{background:var(--info);border-color:var(--infob)}.info .ctag{color:var(--infot)}
.callout.teen{background:var(--teen);border-color:var(--teenb)}.teen .ctag{color:var(--teent)}
a.tel{font-weight:700;white-space:nowrap}.tw:not(.wide) a.tel{white-space:normal}
.notes{margin-top:18px;border-top:1px dashed var(--goldl);padding-top:12px}
.notes label{display:block;font-weight:700;font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);margin-bottom:6px}
.notes textarea,#notesmodal textarea,.contacts input,.dcustom textarea{width:100%;font:inherit;font-size:16px;line-height:1.45;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg);resize:vertical}
details.has-note>summary span::after{content:" ✎";color:var(--gold);font-size:.85em}
.sosgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 14px}
.soscall{display:flex;flex-direction:column;justify-content:center;gap:2px;text-decoration:none;color:#fff;background:var(--sos);border-radius:16px;padding:16px 12px;min-height:92px;text-align:center}
.soscall b{font-family:var(--serif);font-size:1.9rem;line-height:1}.soscall span{font-size:.82rem;font-weight:600}
.soscall.alt{background:var(--acc);color:var(--accfg)}
.soscall.small b{font-size:1.05rem}
.contacts label{display:block;font-size:.74rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);margin:10px 0 4px}
.cline{display:flex;gap:8px;align-items:center}.cline .btn{padding:10px 12px;flex:none}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;background:var(--card);border-top:1px solid var(--goldl);padding:4px 4px calc(4px + env(safe-area-inset-bottom))}
.tabs button{flex:1;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 2px;min-height:56px;font-size:.7rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);border-radius:12px}
.tabs svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tabs button.on{color:var(--acc)}.tabs button.on svg{stroke-width:2.2}
.tabs button.on::after{content:"";width:18px;height:2px;background:var(--goldl);border-radius:2px}
.tabs button.sosb{color:var(--sos)}
#driver{position:fixed;inset:0;z-index:50;display:none;background:#fffdf8;color:#14110c;overflow:auto;padding:calc(12px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom))}
#driver.on{display:block}
#driver .dtop{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
#driver .dtop b{font-family:var(--serif);font-size:1.1rem;color:#0b4a3f}
#driver .dclose{border:1px solid #0b4a3f;background:#0b4a3f;color:#fff;border-radius:999px;padding:10px 16px;font-weight:700}
.dshow{text-align:center;border:2px solid #b8923a;border-radius:18px;padding:22px 12px;margin:6px 0 14px;background:#fff}
.dshow .th{font-size:2.5rem;line-height:1.35;font-weight:600;overflow-wrap:anywhere}
.dshow .en{font-size:1rem;color:#4b4435;margin-top:8px}
.dshow .lead{font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;color:#7a5c10;font-weight:700;margin-bottom:4px}
.dlist{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}
.dlist button{border:1px solid #cdbf9f;background:#fff;color:#14110c;border-radius:999px;padding:10px 12px;font-size:.88rem;font-weight:600}
.dlist button.on{background:#0b4a3f;color:#fff;border-color:#0b4a3f}
.dcustom{margin:0 0 14px;color:#14110c}.dcustom p{font-size:.85rem;color:#4b4435;margin:0 0 6px}
.dcustom textarea{background:#fff;color:#14110c;border-color:#cdbf9f}
.phr{border-top:1px solid #e3d9c0;padding:12px 2px}
.phr .th{font-size:1.5rem;line-height:1.35}.phr .rom{font-size:.9rem;color:#4b4435}.phr .en{font-weight:700;font-size:.95rem}
#driver h3{font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:#7a5c10;margin:16px 0 4px;font-family:-apple-system,sans-serif}
#notesmodal{position:fixed;inset:0;z-index:40;display:none}
#notesmodal.on{display:block}
#notesmodal .shade{position:absolute;inset:0;background:rgba(0,0,0,.5)}
#notesmodal .panel{position:absolute;left:0;right:0;bottom:0;top:6vh;max-width:760px;margin:0 auto;background:var(--card);border-radius:20px 20px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));overflow:auto;border-top:2px solid var(--goldl)}
#notesmodal h2{margin:0 0 4px;font-size:1.3rem;color:var(--acc)}
#notesmodal .nhint{color:var(--mut);font-size:.85rem;margin:0 0 12px}
#notesmodal .nlabel{font-weight:700;font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);margin:12px 0 6px;display:block}
.nitem{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:8px 0}.nitem a{font-weight:700;text-decoration:none}
.ntext{white-space:pre-wrap;margin-top:4px;font-size:.95rem}.nempty{color:var(--mut)}
.nbtns{display:flex;gap:8px;margin:14px 0 4px;flex-wrap:wrap}
.nbtns button{flex:1;min-width:110px;border:0;border-radius:10px;padding:12px;font-weight:700;background:var(--acc);color:var(--accfg);font-size:.95rem}
.nbtns .nclose{background:rgba(127,127,127,.2);color:var(--fg)}
.nmsg{font-size:.85rem;color:var(--acc);min-height:1.2em}
.foot{color:var(--mut);font-size:.8rem;text-align:center;margin:18px 0 0}
@media (max-width:600px){
.tw table.cards{table-layout:auto}.cards thead{display:none}.cards tbody,.cards tr,.cards td{display:block;width:auto!important}
.cards tr{border:1px solid var(--line);border-radius:12px;margin:10px 0;padding:8px 12px;background:var(--card)}
.cards tbody tr:nth-child(even){background:var(--card)}
.cards td{border:0;padding:4px 0;min-width:0}.cards td:first-child{font-weight:700;font-size:1rem;padding-bottom:6px;min-width:0}
.cards td:not(:first-child)::before{content:attr(data-label);display:block;font-weight:800;color:var(--gold);font-size:.72rem;text-transform:uppercase;letter-spacing:.05em}
.kv{grid-template-columns:1fr}.kv dt{padding-top:0}.kv dd{margin-bottom:8px}}
@media print{.tabs,.appbar{display:none!important}.view{display:block!important}body{background:#fff;color:#000;padding:0}}
.hero .pill{color:#fff;border-color:#e9cf8e}
.appbar .brand{line-height:1.2}
#fxmodal{position:fixed;inset:0;z-index:40;display:none}#fxmodal.on{display:block}
#fxmodal .shade{position:absolute;inset:0;background:rgba(0,0,0,.5)}
#fxmodal .panel{position:absolute;left:0;right:0;bottom:0;top:8vh;max-width:760px;margin:0 auto;background:var(--card);border-radius:20px 20px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));overflow:auto;border-top:2px solid var(--goldl)}
#fxmodal h2{margin:0 0 4px;font-size:1.3rem;color:var(--acc)}#fxmodal .nhint{color:var(--mut);font-size:.85rem;margin:0 0 6px}
#fxmodal .nlabel{font-weight:700;font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);margin:8px 0 6px;display:block}
#fxmodal .search{margin:0 0 4px;font-size:1.3rem}
.fxq{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.fxq div{border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center;background:var(--bg)}.fxq b{display:block;font-family:var(--serif);font-size:1.1rem}.fxq span{font-size:.85rem;color:var(--mut)}
#fxmodal .nbtns button{flex:1;min-width:110px;border:0;border-radius:10px;padding:12px;font-weight:700;background:var(--acc);color:var(--accfg)}#fxmodal .nbtns .nclose{background:rgba(127,127,127,.2);color:var(--fg)}
.pbar{height:6px;border-radius:6px;background:var(--line);overflow:hidden;margin-top:8px}.pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--goldl))}
.pitem{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin:0 0 8px}.pitem.done{opacity:.7}
.pi{display:block;min-height:44px}.pi.chk{display:flex;gap:12px;align-items:flex-start;padding:4px 0;cursor:pointer}
.pi.chk input{width:26px;height:26px;flex:none;accent-color:var(--acc);margin-top:2px}
.pt2,.ptx{min-width:0;overflow-wrap:anywhere}.pt2 b,.ptx b{font-weight:600}
.pitem.done .pt2 b,.pitem.done .ptx b{text-decoration:line-through}
.qty{color:var(--gold);font-size:.85rem;font-weight:700;margin-left:4px}
.pw{display:block;color:var(--mut);font-size:.84rem;margin-top:2px}
.tag{display:inline-block;margin:4px 6px 0 0;border:1px solid var(--line);border-radius:999px;padding:1px 8px;font-size:.7rem;font-weight:700;color:var(--gold);letter-spacing:.03em}
.pchips{display:flex;gap:6px;margin:8px 0 4px;flex-wrap:wrap}
.pc{width:40px;height:40px;border-radius:50%;border:1.5px solid var(--line);background:var(--bg);font-weight:700;font-size:.9rem}
.pc.on{background:var(--acc);color:var(--accfg);border-color:var(--acc)}
.pedit{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;border-top:1px dashed var(--line);padding-top:8px}
.mini{border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:10px;padding:8px 12px;font-size:.82rem;font-weight:700;min-height:38px}.mini[disabled]{opacity:.4}
.subh{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:18px 0 8px;font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
#packsheet{position:fixed;inset:0;z-index:45;display:none}#packsheet.on{display:block}
#packsheet .shade{position:absolute;inset:0;background:rgba(0,0,0,.5)}
#packsheet .panel{position:absolute;left:0;right:0;bottom:0;top:8vh;max-width:760px;margin:0 auto;background:var(--card);border-radius:20px 20px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));overflow:auto;border-top:2px solid var(--goldl)}
#packsheet h2{margin:0 0 8px;font-size:1.3rem;color:var(--acc)}
#packsheet .nlabel{font-weight:700;font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);margin:10px 0 6px;display:block}
#packsheet .search{margin:0 0 4px}
#packsheet .nbtns button{flex:1;min-width:110px;border:0;border-radius:10px;padding:12px;font-weight:700;background:var(--acc);color:var(--accfg);font-size:.95rem}#packsheet .nbtns .nclose{background:rgba(127,127,127,.2);color:var(--fg)}
#packsheet .nbtns button[disabled]{opacity:.4}
#printpack{display:none}
@media print{body.printing .appbar,body.printing .tabs,body.printing main,body.printing #packsheet,body.printing #fxmodal,body.printing #notesmodal,body.printing #driver{display:none!important}body.printing #printpack{display:block}#printpack pre{font:12pt/1.4 sans-serif;white-space:pre-wrap}}

#gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:linear-gradient(160deg,#0b4a3f,#0f6a59)}
#gf{background:#fffdf8;color:#1f1b15;border-radius:20px;padding:30px 22px;width:100%;max-width:360px;text-align:center;box-shadow:0 10px 34px rgba(0,0,0,.3);border:1px solid #b8923a}
#gf .orn{color:#7a5c10;letter-spacing:.4em;font-size:.8rem}#gf h1{font-size:1.4rem;margin:8px 0 6px;color:#0b4a3f}#gf p{margin:0 0 16px;color:#5c5547}
#gf input{width:100%;padding:13px;font-size:16px;border:1px solid #cdbf9f;border-radius:12px;margin-bottom:12px;background:#fff;color:#1f1b15}
#gf button{width:100%;padding:14px;font-size:1rem;font-weight:700;border:0;border-radius:12px;background:#0b4a3f;color:#fff}
#err{color:#a82a22;min-height:1.3em;margin-top:10px;font-size:.9rem}</style>
</head>
<body>
<div id="gate"><form id="gf"><div class="orn">✦ ✦ ✦</div><h1>Thailand Family Travel Guide</h1>
<p>Enter the family password to continue.</p>
<input id="pw" type="password" autocomplete="current-password" autocapitalize="none" autocorrect="off" placeholder="Password" aria-label="Password" required>
<button type="submit">Open guide</button><div id="err" role="alert"></div></form></div>
<div id="app"></div>

  var tg=(it.tg||[]).map(function(t){return {ci:'Carry-on',th:'Buy in Thailand',opt:'Optional'}[t]}).filter(Boolean),tags=tg.map(function(t){return '<span class="tag">'+t+'</span>'}).join('');
  var done=units(it).every(function(k){return P.packed[k]});
  var ctl;
  if(isEach(it)&&P.me===''){ctl='<div class="pchips">'+P.people.map(function(nm,i){return '<button class="pc'+(P.packed[it.id+':'+i]?' on':'')+'" data-pk="'+it.id+':'+i+'" aria-pressed="'+(!!P.packed[it.id+':'+i])+'" aria-label="'+esc(nm)+'">'+esc(initial(i))+'</button>'}).join('')+'</div>';
    ctl='<div class="pi"><div class="ptx"><b>'+esc(it.t)+'</b>'+(it.q?' <span class="qty">'+esc(it.q)+'</span>':'')+'</div>'+(it.w?'<div class="pw">'+esc(it.w)+'</div>':'')+tags+ctl+'</div>'}
  else{var k=units(it)[0];ctl='<label class="pi chk"><input type="checkbox" data-pk="'+k+'"'+(P.packed[k]?' checked':'')+'><span class="pt2"><b>'+esc(it.t)+'</b>'+(it.q?' <span class="qty">'+esc(it.q)+'</span>':'')+(it.w?'<span class="pw">'+esc(it.w)+'</span>':'')+tags+'</span></label>'}
  var ed=packEdit?'<div class="pedit"><button class="mini" data-edit="'+it.id+'">Edit</button><button class="mini" data-del="'+it.id+'">Remove</button><button class="mini" data-up="'+it.id+'|'+s.id+'" '+(ix===0?'disabled':'')+' aria-label="Move up">Up</button><button class="mini" data-down="'+it.id+'|'+s.id+'" '+(ix===n-1?'disabled':'')+' aria-label="Move down">Down</button></div>':'';
  return '<div class="pitem'+(done?' done':'')+'">'+ctl+ed+'</div>'}
function findItem(id){var m=model(),r=null;m.forEach(function(c){c.subs.forEach(function(s){s.items.forEach(function(it){if(it.id===id)r={it:it,sub:s,cat:c}})})});return r}
function persist(){savePack();renderPack()}
function itemForm(it){it=it||{t:'',q:'',w:'',s:'e'};return '<label class="nlabel">Item</label><input id="fi-t" class="search" value="'+esc(it.t)+'" placeholder="Item name"><label class="nlabel">Quantity (optional)</label><input id="fi-q" class="search" value="'+esc(it.q||'')+'" placeholder="e.g. 2 or 6-7"><label class="nlabel">Note (optional)</label><input id="fi-w" class="search" value="'+esc(it.w||'')+'" placeholder="Why or where"><div class="nbtns"><button id="fi-save">Save</button><button class="nclose" id="fi-x">Cancel</button></div>'}
function wireItemForm(b,save){var sc=b.querySelector('[data-sc].on')?b.querySelector('[data-sc].on').dataset.sc:'e';
  $$('[data-sc]',b).forEach(function(x){x.onclick=function(){sc=x.dataset.sc;$$('[data-sc]',b).forEach(function(y){y.classList.toggle('on',y===x)})}});
  $('#fi-x',b).onclick=closeSheet;$('#fi-save',b).onclick=function(){var t=$('#fi-t',b).value.trim();if(!t)return;save({t:t,q:$('#fi-q',b).value.trim(),w:$('#fi-w',b).value.trim(),s:sc});closeSheet();persist()}}
function textInput(title,val,cb){sheet(title,'<input id="fi-n" class="search" value="'+esc(val||'')+'"><div class="nbtns"><button id="fi-ok">Save</button><button class="nclose" id="fi-x">Cancel</button></div>',function(b){$('#fi-n',b).focus();$('#fi-x',b).onclick=closeSheet;$('#fi-ok',b).onclick=function(){var v=$('#fi-n',b).value.trim();if(v){closeSheet();cb(v)}}})}
function bindPack(el){
  $$('[data-zz]',el).forEach(function(b){b.onclick=function(){P.me=b.dataset.me;savePack();renderPack()}});
  var u=$('#pfu',el);if(u)u.onclick=function(){pfUnpacked=!pfUnpacked;renderPack()};var cc=$('#pfc',el);if(cc)cc.onclick=function(){pfCarry=!pfCarry;renderPack()};
  $$('[data-cat]',el).forEach(function(b){b.onclick=function(){packCat=b.dataset.cat;packEdit=false;renderPack();window.scrollTo(0,0)}});
  var bk=$('#pback',el);if(bk)bk.onclick=function(){packCat=null;packEdit=false;renderPack();window.scrollTo(0,0)};
  var pe=$('#pedit',el);if(pe)pe.onclick=function(){packEdit=!packEdit;renderPack()};
  $$('[data-pk]',el).forEach(function(b){b.onclick=function(){var k=b.dataset.pk,y=window.scrollY;if(b.type==='checkbox')P.packed[k]=b.checked;else P.packed[k]=!P.packed[k];savePack();renderPack();window.scrollTo(0,y)}});
  $$('[data-edit]',el).forEach(function(b){b.onclick=function(){var f=findItem(b.dataset.edit);if(!f)return;var id=f.it.id,cu=P.cu.items.filter(function(x){return x.id===id})[0];
    sheet('Edit item',itemForm(f.it),function(bd){wireItemForm(bd,function(v){if(cu){cu.t=v.t;cu.q=v.q;cu.w=v.w;cu.s=v.s}else P.ed[id]={t:v.t,q:v.q,w:v.w,s:v.s}})})}});
  $$('[data-del]',el).forEach(function(b){b.onclick=function(){var id=b.dataset.del;if(!confirm('Remove this item from the list?'))return;P.hid[id]=true;P.cu.items=P.cu.items.filter(function(x){return x.id!==id});persist()}});
  $$('[data-up],[data-down]',el).forEach(function(b){b.onclick=function(){var up=!!b.dataset.up,p=(b.dataset.up||b.dataset.down).split('|'),sub=p[1],s=null;
    model().forEach(function(c){c.subs.forEach(function(x){if(x.id===sub)s=x})});var ids=s.items.map(function(x){return x.id}),i=ids.indexOf(p[0]),j=up?i-1:i+1;if(j<0||j>=ids.length)return;var t=ids[i];ids[i]=ids[j];ids[j]=t;P.ord[sub]=ids;persist()}});
  $$('[data-additem]',el).forEach(function(b){b.onclick=function(){var sub=b.dataset.additem;sheet('Add item',itemForm(),function(bd){wireItemForm(bd,function(v){P.cu.items.push({id:uid(),sub:sub,t:v.t,q:v.q,w:v.w,s:v.s,tg:[]})})})}});
  $$('[data-sugg]',el).forEach(function(b){b.onclick=function(){var sub=b.dataset.sugg,s=null;model().forEach(function(c){c.subs.forEach(function(x){if(x.id===sub)s=x})});
    var h2=s.sugg.map(function(it){return '<div class="pitem"><div class="pi"><div class="ptx"><b>'+esc(it.t)+'</b></div>'+(it.w?'<div class="pw">'+esc(it.w)+'</div>':'')+'<div class="btnrow"><button class="btn" data-sa="'+it.id+'">Add to list</button><button class="btn alt" data-sh="'+it.id+'">Not for us</button></div></div></div>'}).join('');
    sheet('Suggestions for '+s.n,h2+'<div class="nbtns"><button class="nclose" id="fi-x">Close</button></div>',function(bd){$('#fi-x',bd).onclick=function(){closeSheet();renderPack()};
      $$('[data-sa]',bd).forEach(function(x){x.onclick=function(){P.add[x.dataset.sa]=true;savePack();x.closest('.pitem').remove()}});
      $$('[data-sh]',bd).forEach(function(x){x.onclick=function(){P.hid[x.dataset.sh]=true;savePack();x.closest('.pitem').remove()}})})}});
  $$('[data-rensub]',el).forEach(function(b){b.onclick=function(){var id=b.dataset.rensub,cs=P.cu.subs.filter(function(x){return x.id===id})[0],cur='';model().forEach(function(c){c.subs.forEach(function(s){if(s.id===id)cur=s.n})});textInput('Rename subcategory',cur,function(v){if(cs)cs.n=v;else P.ed[id]={n:v};persist()})}});
  $$('[data-delsub]',el).forEach(function(b){b.onclick=function(){if(!confirm('Delete this subcategory and its items?'))return;P.hid[b.dataset.delsub]=true;persist()}});
  var ps=$('#paddsub',el);if(ps)ps.onclick=function(){textInput('New subcategory','',function(v){P.cu.subs.push({id:uid(),cat:packCat,n:v});persist()})};
  var rc=$('#prenc',el);if(rc)rc.onclick=function(){var cur='';model().forEach(function(c){if(c.id===packCat)cur=c.n});textInput('Rename category',cur,function(v){var cc=P.cu.cats.filter(function(x){return x.id===packCat})[0];if(cc)cc.n=v;else P.ed[packCat]={n:v};persist()})};
  var dc=$('#pdelc',el);if(dc)dc.onclick=function(){if(!confirm('Delete this whole category?'))return;P.hid[packCat]=true;packCat=null;packEdit=false;persist()};
  var ac=$('#paddcat',el);if(ac)ac.onclick=function(){textInput('New category','',function(v){P.cu.cats.push({id:uid(),n:v});persist()})};
  var sh=$('#pshare',el);if(sh)sh.onclick=openShare;
  var pr=$('#pprint',el);if(pr)pr.onclick=function(){printPack()};
}
function packText(){var out=['Thailand packing list ('+packProgress().pct+'% packed)'];
  model().forEach(function(c){var lines=[];c.subs.forEach(function(s){s.items.forEach(function(it){lines.push((P.packed[it.id]?'[x] ':'[ ] ')+it.t+(it.q?' ('+it.q+')':''))})});out.push('\n'+c.n.toUpperCase()+'\n'+lines.join('\n'))});
  return out.join('\n')}
function openShare(){sheet('Share or backup','<p class="nhint">Your list is saved on this phone only. Copy it as text to send it, or copy a backup code to move it to another phone.</p><div class="nbtns" style="flex-direction:column"><button id="s-text">Copy list as text</button>'+(navigator.share?'<button id="s-share">Share list</button>':'')+'<button id="s-code">Copy backup code</button><button id="s-imp">Import a backup code</button><button id="s-reset">Reset everything to defaults</button><button class="nclose" id="fi-x">Close</button></div><div class="nmsg" id="s-msg"></div>',function(b){
  var msg=$('#s-msg',b);function cp(t,m){if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(function(){msg.textContent=m},function(){msg.textContent='Copy failed.'});else msg.textContent='Copy is not supported here.'}
  $('#fi-x',b).onclick=closeSheet;$('#s-text',b).onclick=function(){cp(packText(),'Copied. Paste it into your family chat.')};
  var sh=$('#s-share',b);if(sh)sh.onclick=function(){navigator.share({title:'Thailand packing list',text:packText()}).catch(function(){})};
  $('#s-code',b).onclick=function(){cp('THAIPACK1:'+btoa(unescape(encodeURIComponent(JSON.stringify(P)))),'Backup code copied.')};
  $('#s-imp',b).onclick=function(){sheet('Import a backup code','<textarea id="imp" rows="5" class="search" placeholder="Paste the code here"></textarea><div id="imp-p" class="nhint"></div><div class="nbtns"><button id="imp-go" disabled>Replace my list</button><button class="nclose" id="fi-x">Cancel</button></div>',function(b2){
    var data=null;$('#fi-x',b2).onclick=closeSheet;$('#imp',b2).oninput=function(){data=null;var v=this.value.trim(),p=$('#imp-p',b2);try{if(v.indexOf('THAIPACK1:')!==0)throw 0;var j=JSON.parse(decodeURIComponent(escape(atob(v.slice(10)))));if(!j.packed||!j.cu)throw 0;data=j;
      p.textContent='Found '+Object.keys(j.packed).filter(function(k){return j.packed[k]}).length+' packed ticks, '+j.cu.items.length+' custom items. This will replace the list on this phone.'}catch(e){p.textContent='That is not a valid backup code.'}$('#imp-go',b2).disabled=!data};
    $('#imp-go',b2).onclick=function(){if(!data)return;P=data;['packed','hid','ed','add','ord'].forEach(function(k){P[k]=P[k]||{}});savePack();closeSheet();renderPack()}})};
  $('#s-reset',b).onclick=function(){if(!confirm('Reset the whole packing list to defaults? This clears your ticks and edits.'))return;P={v:1,packed:{},hid:{},ed:{},add:{},cu:{cats:[],subs:[],items:[]},ord:{},me:''};savePack();closeSheet();packCat=null;renderPack()}})}
function printPack(){var d=document.getElementById('printpack');if(!d){d=document.createElement('div');d.id='printpack';document.getElementById('app').appendChild(d)}
  d.innerHTML='<pre>'+esc(packText())+'</pre>';document.body.classList.add('printing');setTimeout(function(){window.print();setTimeout(function(){document.body.classList.remove('printing')},500)},50)}

show(startTab);
if(location.hash&&document.getElementById(location.hash.slice(1))&&document.getElementById(location.hash.slice(1)).tagName==='DETAILS'){show('guide');var _d=document.getElementById(location.hash.slice(1));_d.open=true;_d.scrollIntoView()}

/* ---- currency */
(function(){
  var fx=load('thai-guide-fx-v1',{rate:24,when:''}),m=$('#fxmodal'),thb=$('#fxthb'),cad=$('#fxcad'),rt=$('#fxrate');
  function num(v){var n=parseFloat(String(v).replace(/,/g,''));return isNaN(n)?0:n}
  function f(n,d){return n.toLocaleString('en-CA',{minimumFractionDigits:d,maximumFractionDigits:d})}
  function src(){$('#fxsrc').textContent=fx.when?'Rate updated '+fx.when+'. Banks and ATMs give a slightly worse rate.':'Planning rate used in the guide. Tap Update rate online when you have a connection.'}
  function quick(){$('#fxq').innerHTML=[100,500,1000,5000].map(function(b){return '<div><b>฿'+f(b,0)+'</b><span>CA$'+f(b/fx.rate,2)+'</span></div>'}).join('')+[10,50,100,500].map(function(c){return '<div><b>CA$'+c+'</b><span>฿'+f(c*fx.rate,0)+'</span></div>'}).join('')}
  function setRate(r){fx.rate=r;save('thai-guide-fx-v1',fx);quick()}
  $('#fxbtn').onclick=function(){rt.value=fx.rate;thb.value='';cad.value='';src();quick();m.classList.add('on');thb.focus()};
  $('#fxclose').onclick=$('.shade',m).onclick=function(){m.classList.remove('on')};
  thb.oninput=function(){cad.value=thb.value?f(num(thb.value)/fx.rate,2):''};
  cad.oninput=function(){thb.value=cad.value?f(num(cad.value)*fx.rate,0):''};
  rt.oninput=function(){var r=num(rt.value);if(r>0){setRate(r);fx.when='';src();thb.oninput()}};
  $('#fxupd').onclick=function(){var msg=$('#fxmsg');msg.textContent='Checking…';
    var ctl=window.AbortController?new AbortController():null;var t=setTimeout(function(){ctl&&ctl.abort()},8000);
    fetch('https://open.er-api.com/v6/latest/CAD',ctl?{signal:ctl.signal}:{}).then(function(r){return r.json()}).then(function(j){clearTimeout(t);var r=j&&j.rates&&j.rates.THB;if(!r)throw 0;
      fx.when=new Date().toLocaleDateString('en-CA',{month:'short',day:'numeric'});setRate(Math.round(r*100)/100);rt.value=fx.rate;src();thb.oninput();msg.textContent='Rate updated.'})
    .catch(function(){clearTimeout(t);msg.textContent='Could not reach the rate service. Keeping the saved rate. You can type your own rate above.'})};
})();

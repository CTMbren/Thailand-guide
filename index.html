<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0f6b6b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Thailand">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<title>Thailand Family Travel Guide</title>
<style>
:root{--bg:#fbf8f3;--fg:#1d2a2a;--mut:#5b6a6a;--card:#fff;--line:#e3ddd2;--acc:#0f6b6b;--acc2:#d9822b;
--tip:#e8f4ee;--tipb:#2f8a5c;--heads:#fff4dc;--headsb:#d9a21b;--must:#fde8e6;--mustb:#c9382c;
--info:#e7f0fb;--infob:#3b78c4;--teen:#f1e8fb;--teenb:#7d4bc2;--shadow:0 1px 3px rgba(0,0,0,.08)}
@media (prefers-color-scheme:dark){:root{--bg:#121818;--fg:#e8eeee;--mut:#9fb0b0;--card:#1a2323;--line:#2c3a3a;
--acc:#4fc3c3;--acc2:#f0a25a;--tip:#16301f;--heads:#33290c;--must:#3a1a17;--info:#14263d;--teen:#271a3a;--shadow:none}}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans Thai","Thonburi",sans-serif;
padding-bottom:calc(76px + env(safe-area-inset-bottom))}
a{color:var(--acc)}
.hero{background:linear-gradient(135deg,#0f6b6b,#1b8f7a 60%,#d9822b);color:#fff;
padding:calc(22px + env(safe-area-inset-top)) 18px 22px}
.hero h1{margin:0 0 6px;font-size:1.65rem;line-height:1.2}
.hero p{margin:0;opacity:.95;font-size:.95rem}
.count{display:inline-block;margin-top:12px;background:rgba(255,255,255,.2);border-radius:999px;padding:5px 12px;font-size:.88rem;font-weight:600}
main{max-width:820px;margin:0 auto;padding:12px 12px 0}
.tools{display:flex;gap:8px;margin:4px 0 12px}
.tools button{flex:1;border:1px solid var(--line);background:var(--card);color:var(--fg);padding:9px;border-radius:10px;font-size:.9rem}
details.sec{background:var(--card);border:1px solid var(--line);border-radius:14px;margin:0 0 10px;box-shadow:var(--shadow);scroll-margin-top:10px}
details.sec>summary{list-style:none;cursor:pointer;padding:15px 16px;font-weight:700;font-size:1.08rem;display:flex;justify-content:space-between;align-items:center;gap:10px;-webkit-tap-highlight-color:transparent}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary::after{content:"";width:9px;height:9px;border-right:2.5px solid var(--acc);border-bottom:2.5px solid var(--acc);transform:rotate(45deg);transition:transform .15s;flex:none;margin-right:4px}
details.sec[open]>summary::after{transform:rotate(-135deg)}
details.sec[open]>summary{border-bottom:1px solid var(--line);color:var(--acc)}
.secbody{padding:6px 16px 16px}
.secbody h3{margin:22px 0 6px;font-size:1.12rem;color:var(--acc)}
.secbody h4{margin:20px 0 8px;font-size:1rem;color:var(--acc2);border-bottom:2px solid var(--line);padding-bottom:4px}
.secbody p{margin:.55em 0}
.secbody ul,.secbody ol{padding-left:1.25em;margin:.5em 0}
.secbody li{margin:.35em 0}
.secbody li:has(>label.ck){list-style:none;margin-left:-1.1em}
label.ck{display:flex;gap:10px;align-items:flex-start;padding:4px 0}
label.ck input{width:22px;height:22px;flex:none;margin-top:2px;accent-color:var(--acc)}
label.ck input:checked+span{text-decoration:line-through;opacity:.55}
.tw{overflow-x:auto;margin:10px -4px;-webkit-overflow-scrolling:touch}
.tw.wide table{min-width:34rem}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{text-align:left;vertical-align:top;padding:8px 9px;border-bottom:1px solid var(--line)}
th{background:rgba(15,107,107,.1);font-weight:700;white-space:nowrap}
td:first-child{min-width:5.5rem}
.tw:not(.wide) table{table-layout:fixed}
.tw:not(.wide) td,.tw:not(.wide) th{overflow-wrap:anywhere}
.tw:not(.wide) td:first-child{width:30%}
tbody tr:nth-child(even){background:rgba(127,127,127,.05)}
.callout{border-left:5px solid;border-radius:10px;padding:10px 12px;margin:12px 0;display:flex;flex-direction:column;gap:3px;font-size:.95rem}
.callout>div p{margin:.3em 0}
.ctag{font-size:.72rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em}
.callout.tip{background:var(--tip);border-color:var(--tipb)}.tip .ctag{color:var(--tipb)}
.callout.heads{background:var(--heads);border-color:var(--headsb)}.heads .ctag{color:#b07f0a}
.callout.must{background:var(--must);border-color:var(--mustb)}.must .ctag{color:var(--mustb)}
.callout.info{background:var(--info);border-color:var(--infob)}.info .ctag{color:var(--infob)}
.callout.teen{background:var(--teen);border-color:var(--teenb)}.teen .ctag{color:var(--teenb)}
a.tel{font-weight:700;white-space:nowrap}
.tw:not(.wide) a.tel{white-space:normal}
footer{max-width:820px;margin:18px auto 0;padding:0 16px;color:var(--mut);font-size:.82rem;text-align:center}
.bar{position:fixed;left:0;right:0;bottom:0;display:flex;gap:8px;padding:8px 10px calc(8px + env(safe-area-inset-bottom));
background:var(--card);border-top:1px solid var(--line);z-index:20}
.bar button,.bar a{flex:1;text-align:center;text-decoration:none;border:0;border-radius:12px;padding:12px 6px;font-size:.92rem;font-weight:700;background:rgba(15,107,107,.12);color:var(--acc)}
.bar a.sos{background:#c9382c;color:#fff}
#drawer{position:fixed;inset:0;z-index:30;display:none}
#drawer.on{display:block}
#drawer .shade{position:absolute;inset:0;background:rgba(0,0,0,.45)}
#drawer nav{position:absolute;left:0;right:0;bottom:0;max-height:82vh;overflow:auto;background:var(--card);border-radius:18px 18px 0 0;padding:14px 8px calc(20px + env(safe-area-inset-bottom))}
#drawer nav a{display:block;padding:11px 14px;text-decoration:none;color:var(--fg);border-radius:10px}
#drawer nav a:active{background:rgba(15,107,107,.14)}
.navgroup{padding:12px 14px 4px;font-size:.78rem;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--acc)}
@media print{.bar,.tools,#drawer{display:none!important}details.sec>.secbody{display:block}body{padding:0;background:#fff;color:#000}.hero{background:#fff;color:#000}}
.notes{margin-top:18px;border-top:2px dashed var(--line);padding-top:12px}
.notes label{display:block;font-weight:700;font-size:.9rem;color:var(--acc2);margin-bottom:6px}
.notes textarea,#notesmodal textarea{width:100%;font:inherit;font-size:16px;line-height:1.45;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg);resize:vertical}
details.has-note>summary span::after{content:" 📝";font-size:.85em}
.bar button,.bar a{padding:12px 2px;font-size:.82rem}
#notesmodal{position:fixed;inset:0;z-index:40;display:none}
#notesmodal.on{display:block}
#notesmodal .shade{position:absolute;inset:0;background:rgba(0,0,0,.5)}
#notesmodal .panel{position:absolute;left:0;right:0;bottom:0;top:6vh;max-width:820px;margin:0 auto;background:var(--card);border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));overflow:auto}
#notesmodal h2{margin:0 0 4px;font-size:1.2rem;color:var(--acc)}
#notesmodal .nhint{color:var(--mut);font-size:.85rem;margin:0 0 12px}
#notesmodal .nlabel{font-weight:700;font-size:.9rem;margin:12px 0 6px;display:block}
.nitem{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:8px 0}
.nitem a{font-weight:700;text-decoration:none}
.ntext{white-space:pre-wrap;margin-top:4px;font-size:.95rem}
.nempty{color:var(--mut)}
.nbtns{display:flex;gap:8px;margin:14px 0 4px;flex-wrap:wrap}
.nbtns button{flex:1;min-width:110px;border:0;border-radius:10px;padding:12px;font-weight:700;background:var(--acc);color:#fff;font-size:.95rem}
.nbtns .nclose{background:rgba(127,127,127,.2);color:var(--fg)}
.nmsg{font-size:.85rem;color:var(--acc);min-height:1.2em}
#finder{margin:12px 0}
.fcats{display:flex;flex-wrap:wrap;gap:6px}
.fcats button,.fact button{border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:999px;padding:9px 12px;font-size:.88rem}
.fcats button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.fact{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.fact .fgps{background:#c9382c;color:#fff;border-color:#c9382c;font-weight:700}
.fstat{min-height:1.2em;font-size:.9rem;color:var(--mut)}
.fitem{display:flex;gap:10px;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0;background:var(--card)}
.fmeta{font-size:.82rem;color:var(--mut)}
a.fgo{flex:none;text-decoration:none;background:var(--acc);color:#fff;border-radius:10px;padding:10px 12px;font-weight:700;font-size:.85rem}
.fnote{font-size:.85rem;color:var(--mut)}
@media (max-width:600px){
.tw table.cards{table-layout:auto}
.cards thead{display:none}
.cards tbody,.cards tr,.cards td{display:block;width:auto!important}
.cards tr{border:1px solid var(--line);border-radius:12px;margin:10px 0;padding:8px 12px;background:var(--card)}
.cards tbody tr:nth-child(even){background:var(--card)}
.cards td{border:0;padding:4px 0;min-width:0}
.cards td:first-child{font-weight:700;font-size:1rem;padding-bottom:6px;min-width:0}
.cards td:not(:first-child)::before{content:attr(data-label);display:block;font-weight:800;color:var(--acc);font-size:.72rem;text-transform:uppercase;letter-spacing:.05em}
}
</style>
</head>

<div id="gate"><form id="gf"><div class="flag">&#127481;&#127469;</div><h1>Thailand Family Travel Guide</h1>
<p>Enter the family password to continue.</p>
<input id="pw" type="password" autocomplete="current-password" autocapitalize="none" autocorrect="off" placeholder="Password" required>
<button type="submit">Open guide</button><div id="err" role="alert"></div></form></div>
<div id="app"></div>
<style>#gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:linear-gradient(135deg,#0f6b6b,#1b8f7a 60%,#d9822b)}
#gf{background:#fff;color:#1d2a2a;border-radius:18px;padding:28px 22px;width:100%;max-width:360px;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.25)}
#gf .flag{font-size:2.4rem}#gf h1{font-size:1.25rem;margin:6px 0}#gf p{margin:0 0 16px;color:#5b6a6a}
#gf input{width:100%;padding:13px;font-size:1rem;border:1px solid #cfc8bb;border-radius:10px;margin-bottom:12px}
#gf button{width:100%;padding:13px;font-size:1rem;font-weight:700;border:0;border-radius:10px;background:#0f6b6b;color:#fff}
#err{color:#c9382c;min-height:1.3em;margin-top:10px;font-size:.9rem}</style>

  .then(function(k){return crypto.subtle.deriveKey({name:'PBKDF2',salt:salt,iterations:200000,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['decrypt'])})
  .then(function(k){return crypto.subtle.decrypt({name:'AES-GCM',iv:iv},k,ct)})
  .then(function(buf){
    document.getElementById('gate').remove();
    document.getElementById('app').innerHTML=new TextDecoder().decode(buf);
    try{localStorage.setItem(KEY,pw.trim().toLowerCase())}catch(e){}
    init();
  });
}
function init(){
(function(){
var $=function(s,r){return (r||document).querySelector(s)},$$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))};
function openSec(id){var d=document.getElementById(id);if(d&&d.tagName==='DETAILS'){d.open=true;setTimeout(function(){d.scrollIntoView()},30)}}
$$('[data-open]').forEach(function(a){a.addEventListener('click',function(e){e.preventDefault();$('#drawer').classList.remove('on');var id=a.getAttribute('data-open');history.replaceState(null,'','#'+id);openSec(id)})});
$('#menu').onclick=function(){$('#drawer').classList.add('on')};
$('#drawer .shade').onclick=function(){$('#drawer').classList.remove('on')};
$('#glance').onclick=function(){openSec('at-a-glance')};
$('#expand').onclick=function(){$$('details.sec').forEach(function(d){d.open=true})};
$('#collapse').onclick=function(){$$('details.sec').forEach(function(d){d.open=false});window.scrollTo(0,0)};
if(location.hash){openSec(location.hash.slice(1))}
// checklist persistence
var KEY='thai-guide-checks-v1',st={};try{st=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}
$$('input[type=checkbox][data-k]').forEach(function(c){c.checked=!!st[c.dataset.k];c.addEventListener('change',function(){st[c.dataset.k]=c.checked;try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}})});
// countdown (departure 00:15 Dec 25 2026 Vancouver = 08:15 UTC)
var dep=Date.UTC(2026,11,25,8,15),now=Date.now(),el=$('#count'),d=Math.ceil((dep-now)/864e5);
el.textContent=d>1?d+' days to departure':d===1?'Departs tomorrow':now<dep+14*864e5?'Trip in progress, enjoy!':'Welcome home';
})();
var $=function(s,r){return (r||document).querySelector(s)},$$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))};
/* ---------- Notes (per section, saved on this phone) ---------- */
(function(){
var NK='thai-guide-notes-v1',notes={};
try{notes=JSON.parse(localStorage.getItem(NK)||'{}')}catch(e){}
function saveNotes(){try{localStorage.setItem(NK,JSON.stringify(notes))}catch(e){}}
function titleOf(d){var s=d.querySelector('summary span');return s?s.textContent:d.id}
function mark(d){d.classList.toggle('has-note',!!(notes[d.id]||'').trim())}
var timer;
$$('details.sec').forEach(function(d){
  var box=document.createElement('div');box.className='notes';
  box.innerHTML='<label>📝 My notes for this section</label><textarea rows="3" placeholder="Add a note: who is booking this, a question to ask, a reminder…"></textarea>';
  var ta=box.querySelector('textarea');ta.value=notes[d.id]||'';
  ta.addEventListener('input',function(){notes[d.id]=ta.value;mark(d);clearTimeout(timer);timer=setTimeout(saveNotes,300)});
  ta.addEventListener('blur',saveNotes);
  d.querySelector('.secbody').appendChild(box);mark(d);
});
var modal=document.getElementById('notesmodal');
function renderNotes(){
  var list=modal.querySelector('.nlist'),html='',any=false;
  $$('details.sec').forEach(function(d){
    var t=(notes[d.id]||'').trim();if(!t)return;any=true;
    var div=document.createElement('div');
    html+='<div class="nitem"><a href="#'+d.id+'" data-jump="'+d.id+'">'+titleOf(d).replace(/</g,'&lt;')+'</a><div class="ntext">'+t.replace(/&/g,'&amp;').replace(/</g,'&lt;')+'</div></div>';
  });
  list.innerHTML=any?html:'<p class="nempty">No section notes yet. Open any section and type in its notes box at the bottom.</p>';
  $$('[data-jump]',list).forEach(function(a){a.addEventListener('click',function(e){e.preventDefault();modal.classList.remove('on');var id=a.getAttribute('data-jump');history.replaceState(null,'','#'+id);var d=document.getElementById(id);d.open=true;setTimeout(function(){d.scrollIntoView()},30)})});
}
function allText(){
  var out=[];var g=(notes.__general||'').trim();if(g)out.push('GENERAL\n'+g);
  $$('details.sec').forEach(function(d){var t=(notes[d.id]||'').trim();if(t)out.push(titleOf(d).toUpperCase()+'\n'+t)});
  return 'Thailand trip notes\n\n'+out.join('\n\n');
}
var gen=modal.querySelector('.ngen');gen.value=notes.__general||'';
gen.addEventListener('input',function(){notes.__general=gen.value;clearTimeout(timer);timer=setTimeout(saveNotes,300)});
document.getElementById('notesbtn').onclick=function(){renderNotes();modal.classList.add('on')};
modal.querySelector('.shade').onclick=modal.querySelector('.nclose').onclick=function(){saveNotes();modal.classList.remove('on')};
var msg=modal.querySelector('.nmsg');
modal.querySelector('.ncopy').onclick=function(){
  var t=allText();
  var done=function(){msg.textContent='Copied. Paste it into your family chat.'};
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(done,function(){msg.textContent='Copy failed. Press and hold the text to copy.'})}
  else{msg.textContent='Copy not supported here.'}
};
var sh=modal.querySelector('.nshare');
if(navigator.share){sh.onclick=function(){navigator.share({title:'Thailand trip notes',text:allText()}).catch(function(){})}}else{sh.style.display='none'}
})();

/* ---------- Nearby finder ---------- */
(function(){
var root=document.getElementById('finder');if(!root)return;
var CATS={
 seven:{label:'7-Eleven',icon:'🏪',q:function(a){return '(nwr'+a+'["name"~"7[- ]?Eleven|เซเว่น",i];nwr'+a+'["brand"~"7[- ]?Eleven",i];);'},fallback:'7-Eleven'},
 mall:{label:'Malls and supermarkets',icon:'🛍️',q:function(a){return '(nwr'+a+'["shop"~"^(mall|department_store|supermarket)$"];);'},fallback:'shopping mall'},
 market:{label:'Markets',icon:'🌙',q:function(a){return '(nwr'+a+'["amenity"="marketplace"];);'},fallback:'night market'},
 pharm:{label:'Pharmacies',icon:'💊',q:function(a){return '(nwr'+a+'["amenity"="pharmacy"];nwr'+a+'["healthcare"="pharmacy"];);'},fallback:'pharmacy'}
};
var AREAS={villa:{label:'Near the Pattaya villa (Phratumnak Hill)',lat:12.9115,lon:100.8665},valia:{label:'Near the Valia (Sukhumvit 24)',lat:13.7310,lon:100.5695}};
var MIRRORS=['https://overpass-api.de/api/interpreter','https://overpass.kumi.systems/api/interpreter','https://overpass.private.coffee/api/interpreter'];
var CK='thai-finder-cache-v1',cache={};try{cache=JSON.parse(localStorage.getItem(CK)||'{}')}catch(e){}
var cat='seven',pos=null,posLabel='';
root.innerHTML='<div class="fcats"></div><div class="fact"><button class="fgps">📍 Use my location</button><button class="farea" data-a="villa">Villa area</button><button class="farea" data-a="valia">Valia area</button></div><div class="fstat" role="status"></div><div class="fres"></div>';
var fc=root.querySelector('.fcats'),st=root.querySelector('.fstat'),res=root.querySelector('.fres');
Object.keys(CATS).forEach(function(k){var b=document.createElement('button');b.textContent=CATS[k].icon+' '+CATS[k].label;b.dataset.c=k;b.className=k===cat?'on':'';b.onclick=function(){cat=k;$$('button',fc).forEach(function(x){x.className=x.dataset.c===cat?'on':''});if(pos)search();else showCached()};fc.appendChild(b)});
function dist(a,b,c,d){var R=6371000,r=Math.PI/180,x=(c-a)*r,y=(d-b)*r,h=Math.sin(x/2)*Math.sin(x/2)+Math.cos(a*r)*Math.cos(c*r)*Math.sin(y/2)*Math.sin(y/2);return 2*R*Math.asin(Math.sqrt(h))}
function fmt(m){return m<1000?Math.round(m/10)*10+' m':(m/1000).toFixed(1)+' km'}
function esc(t){return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;')}
function mapsSearch(){return 'https://www.google.com/maps/search/'+encodeURIComponent(CATS[cat].fallback)+'/@'+pos.lat+','+pos.lon+',16z'}
function render(items,note){
  var h='';
  if(note)h+='<p class="fnote">'+note+'</p>';
  if(!items.length)h+='<p class="fnote">Nothing found in the map data. <a target="_blank" rel="noopener" href="'+mapsSearch()+'">Search Google Maps here</a>.</p>';
  items.forEach(function(it){
    var walk=Math.max(1,Math.round(it.d*1.25/80));
    h+='<div class="fitem"><div class="fmain"><b>'+esc(it.name)+'</b><div class="fmeta">'+fmt(it.d)+' · about '+walk+' min walk'+(it.hours?' · '+esc(it.hours):'')+'</div>'+(it.addr?'<div class="fmeta">'+esc(it.addr)+'</div>':'')+'</div><a class="fgo" target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&destination='+it.lat+','+it.lon+'&travelmode=walking">Directions</a></div>';
  });
  if(items.length)h+='<p class="fnote"><a target="_blank" rel="noopener" href="'+mapsSearch()+'">See more in Google Maps</a></p>';
  res.innerHTML=h;
}
function showCached(){
  var c=cache[cat];if(!c){res.innerHTML='';st.textContent='Choose "Use my location" or an area.';return}
  pos={lat:c.lat,lon:c.lon};
  render(c.items,'Saved results from '+new Date(c.t).toLocaleString()+' (offline copy).');st.textContent='';
}
function tryFetch(body,i){
  if(i>=MIRRORS.length)return Promise.reject(new Error('all mirrors failed'));
  var ctl=typeof AbortController!=='undefined'?new AbortController():null,tm=setTimeout(function(){ctl&&ctl.abort()},15000);
  return fetch(MIRRORS[i],{method:'POST',body:'data='+encodeURIComponent(body),headers:{'Content-Type':'application/x-www-form-urlencoded'},signal:ctl?ctl.signal:undefined})
   .then(function(r){clearTimeout(tm);if(!r.ok)throw new Error('http '+r.status);return r.json()})
   .catch(function(){clearTimeout(tm);return tryFetch(body,i+1)});
}
function search(){
  var p=pos,c=cat;st.textContent='Searching '+CATS[c].label+' near '+(posLabel||'you')+'…';res.innerHTML='';
  var radius=1500;
  function go(r){
    var a='(around:'+r+','+p.lat+','+p.lon+')';
    var body='[out:json][timeout:25];'+CATS[c].q(a)+'out center 120;';
    return tryFetch(body,0).then(function(j){
      var items=(j.elements||[]).map(function(e){
        var la=e.lat!=null?e.lat:(e.center&&e.center.lat),lo=e.lon!=null?e.lon:(e.center&&e.center.lon);if(la==null)return null;
        var t=e.tags||{};
        var addr=[t['addr:housenumber'],t['addr:street']].filter(Boolean).join(' ');
        return {name:t['name:en']||t.name||t.brand||CATS[c].label,lat:la,lon:lo,d:dist(p.lat,p.lon,la,lo),hours:t.opening_hours||'',addr:addr};
      }).filter(Boolean).sort(function(x,y){return x.d-y.d});
      if(items.length<3&&r<4000)return go(r*2.5);
      return items.slice(0,15);
    });
  }
  go(radius).then(function(items){
    if(c!==cat)return;
    cache[c]={t:Date.now(),lat:p.lat,lon:p.lon,items:items};try{localStorage.setItem(CK,JSON.stringify(cache))}catch(e){}
    st.textContent='';render(items,'');
  }).catch(function(){
    if(c!==cat)return;
    if(cache[c]){render(cache[c].items,'Could not reach the map service, so these are saved results from '+new Date(cache[c].t).toLocaleString()+'.');st.textContent=''}
    else{st.textContent='Could not reach the map service. Check your connection, or use Google Maps below.';res.innerHTML='<p class="fnote"><a target="_blank" rel="noopener" href="'+mapsSearch()+'">Search Google Maps here</a></p>'}
  });
}
root.querySelector('.fgps').onclick=function(){
  if(!navigator.geolocation){st.textContent='Location is not available in this browser. Pick an area instead.';return}
  st.textContent='Finding your location…';
  navigator.geolocation.getCurrentPosition(function(g){pos={lat:g.coords.latitude,lon:g.coords.longitude};posLabel='you';search()},
   function(){st.textContent='Could not get your location (permission denied or no signal). Pick an area instead.'},{enableHighAccuracy:false,timeout:15000,maximumAge:60000});
};
$$('.farea',root).forEach(function(b){b.onclick=function(){var a=AREAS[b.dataset.a];pos={lat:a.lat,lon:a.lon};posLabel=a.label;search()}});
showCached();
})();

}

if(saved){unlock(saved).catch(function(){try{localStorage.removeItem(KEY)}catch(e){}})}
document.getElementById('gf').addEventListener('submit',function(e){e.preventDefault();
  var v=document.getElementById('pw').value;
  unlock(v).catch(function(){document.getElementById('err').textContent='That is not the password. Try again.'});
});
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(function(){})}
})();
